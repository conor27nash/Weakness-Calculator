name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pwa

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: pwa

      - name: Build
        run: npm run build
        working-directory: pwa

  desktop:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pwa/package-lock.json

      - name: Install Wails system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: pwa

      - name: Copy frontend dist to desktop
        run: cp -r pwa/dist desktop/frontend/dist

      - name: Run Go tests
        run: go test ./backend/...
        working-directory: desktop

      - name: Go build check
        run: go build ./...
        working-directory: desktop
